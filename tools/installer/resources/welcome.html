<body>
    <h1>Aurora for Audacity</h1>

    <p>
        This installer installs the Aurora module for Audacity.
    </p>

    <p>
        The module will be installed in your user Library:
    </p>

    <p>
        <code>~/Library/Application Support/audacity/modules</code>
    </p>

    <p>
        After installation, restart Audacity if it is currently running.
    </p>
</body>
